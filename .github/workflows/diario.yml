name: ILPI diario

on:
  schedule:
    - cron: '30 8 * * *'      # 08:30 UTC = 05:30 (verano) / 04:30 (invierno) hora de Chile: aviso de la mañana, para el día en curso
  workflow_dispatch:

concurrency:
  group: ilpi-diario
  cancel-in-progress: false

jobs:
  calcular:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Pruebas
        run: python -m pytest -q

      - name: Calcular indice
        env:
          AMBIENT_API_KEY: ${{ secrets.AWN }}
          AMBIENT_APPLICATION_KEY: ${{ secrets.AWN_APPLICATION_KEY }}
          MAC_PORTILLO: ${{ secrets.MAC_PORTILLO }}
          MAC_TINGUIRIRICA: ${{ secrets.MAC_TINGUIRIRICA }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          EMAIL_MODO: ${{ vars.EMAIL_MODO }}
          ALERTA_FORZAR: ${{ vars.ALERTA_FORZAR }}
          USAR_WRF: '1'
        run: python -m ilpi.run_daily

      - name: Guardar historico y pagina
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add historico/ docs/
          git diff --staged --quiet || git commit -m "Auto: ILPI $(date -u +%F) [skip ci]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rechazado (intento $i): integrando cambios nuevos del repositorio"
            git pull --rebase -X theirs origin main
          done
          exit 1

  publicar:
    # Solo si defines la variable del repositorio PUBLICAR_PAGES = true (y tu plan permite Pages)
    needs: calcular
    if: ${{ vars.PUBLICAR_PAGES == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
