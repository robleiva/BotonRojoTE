name: Capa de ignicion (OSM)

on:
  workflow_dispatch:

concurrency:
  group: ilpi-osm
  cancel-in-progress: false

jobs:
  osm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descargar OpenStreetMap y calcular la exposicion
        run: python scripts/preparar_ignicion.py

      - name: Guardar la capa
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datos/ignicion_90m.npz datos/osm_resumen.json
          git diff --staged --quiet || git commit -m "Auto: capa de ignicion OSM $(date -u +%F) [skip ci]"
          git push
